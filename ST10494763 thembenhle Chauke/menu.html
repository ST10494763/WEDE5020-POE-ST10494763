    <section id="burger-gallery">
    <h2>Our Burger Gallery</h2>
    <div class="gallery">
      <div class="burger-card" onclick="showInfo(0)">
        <img src="Image/Double burger.jpeg" alt="Double Burger" />
        <p>Double Burger</p>
      </div>
      <div class="burger-card" onclick="showInfo(1)">
        <img src="Image/Double chicken.jpeg" alt="Double Chicken Burger" />
        <p>Double Chiken burger</p>
      </div>
      <div class="burger-card" onclick="showInfo(2)">
        <img src="Image/Triple burger.jpg" alt="triple Trouble" />
        <p>Triple Trouble</p>
      </div>
      <div class="burger-card" onclick="showInfo(3)">
        <img src="Image/Classic cheese.jpg" alt="Cheesy Overload" />
        <p>Cheesy Overload</p>
      </div>
      <div class="burger-card" onclick="showInfo(4)">
        <img src="Image/spicy flame" alt="Spicy Flame" />
        <p>Spicy Flame</p>
      </div>
      <div class="burger-card" onclick="showInfo(5)">
        <img src="Image/BBQ.webp" alt="BBQ Boss" />
        <p>BBQ Boss</p>
      </div>
    </div>
    <div id="popup" class="popup">
      <span class="close" onclick="closePopup()">&times;</span>
      <h3 id="burger-title"></h3>
      <p id="burger-description"></p>
    </div>
  </section>



   <div class="lightbox" id="lightbox">
     <span class="close">&times;</span>
     <img class="lightbox-img" id="lightbox-img">
   </div>
